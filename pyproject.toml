[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Customer Support Resolution Copilot — AI-powered support workflow using LangGraph, RAG, and human-in-the-loop approval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langsmith>=0.1.0",
    "pydantic>=2.0.0",
    "chromadb>=0.5.0",
    "streamlit>=1.38.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
