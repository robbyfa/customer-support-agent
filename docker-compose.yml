services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      CHECKPOINT_DB: /app/runtime/checkpoints.sqlite
    volumes:
      - checkpoints:/app/runtime
      - embeddings:/root/.cache/chroma
    restart: unless-stopped
  copilot:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_URL: http://api:8000
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  checkpoints:
  embeddings:
