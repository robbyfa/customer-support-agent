name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.4"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run pytest -m "not llm" -q
      - run: uv run python -m evals.smoke --output /tmp/evaluation-results.md
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-smoke
          path: /tmp/evaluation-results.md
      - run: docker build -t support-copilot:ci .
